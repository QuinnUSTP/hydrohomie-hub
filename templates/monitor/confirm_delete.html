{% extends "base.html" %}
{% block title %}Confirm delete - HydroHomie{% endblock %}
{% block content %}
<div class="mx-auto" style="max-width: 560px;">
  <h1 class="h4 mb-3">Delete this record?</h1>
  <div class="card shadow-sm">
    <div class="card-body">
      <p class="mb-3">{{ object }}</p>
      <form method="post">
        {% csrf_token %}
        <div class="d-flex gap-2">
          <button type="submit" class="btn btn-danger">Delete</button>
          <a href="{{ back_url }}" class="btn btn-outline-secondary">Cancel</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
